    <script type="application/ld+json">
      {
        "@context": "https://schema.org",

    <!-- Keep the page dark (no white flash) and start fetching the video while the elevator intro is about to play. -->
    <script>
      (function () {
        try {
          // arriving via 404.html: restore the originally requested address before the app starts
          var wanted = sessionStorage.getItem("zena-redirect");
          if (wanted) {
            sessionStorage.removeItem("zena-redirect");
            if (location.pathname === "/") history.replaceState(null, "", wanted);
          }
        } catch (e) {}
        try {
          var p = location.pathname;
          var home = p === "/" || p === "/ka" || p === "/ka/";
          var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
          if (home && !reduce && !sessionStorage.getItem("zena-intro-seen")) {
            document.documentElement.classList.add("intro-pending");
            // start fetching the intro video right away (before the app bundle has loaded)
            var l = document.createElement("link");
            l.rel = "preload";
            l.as = "video";
            l.type = "video/mp4";
            l.href = matchMedia("(orientation: portrait)").matches
              ? "/intro/zena-intro-portrait.mp4"
              : "/intro/zena-intro-landscape.mp4";
            document.head.appendChild(l);
            // failsafe: never stay on the dark pre-intro background, whatever happens
            setTimeout(function () {
              document.documentElement.classList.remove("intro-pending");
            }, 10000);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
